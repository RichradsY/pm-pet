<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"><title>PM Pet</title><style>

#pm-pet-desktop{--pp-paper:light-dark(#fff,#292d2e);--pp-ink:light-dark(#283330,#edf1ee);--pp-muted:light-dark(#66736d,#bac3bd);--pp-line:light-dark(#dce5de,#4a5750);--pp-green:light-dark(#42755c,#9cc9a9);--pp-warm:light-dark(#fff3d9,#4e432f);--pp-fur:light-dark(#ad7c58,#bc906c);--pp-wing:light-dark(#8a5e43,#936c4e);--pp-cream:light-dark(#fff0d5,#f0daba);--pp-face:light-dark(#3d302b,#33261f);--pp-eye-white:light-dark(#fffdf8,#fff5e4);--pp-gold:light-dark(#eea949,#e5a34f);--pp-pink:light-dark(#e9ad9b,#dca395);--pp-chick:light-dark(#ffe196,#efd089);--pp-chick-wing:light-dark(#efc66e,#d6ac60);--pp-bg1:light-dark(#f0f2ed,#293833);--pp-bg2:light-dark(#dce6df,#25343c);--pp-shadow:light-dark(#374d3b20,#00000038);--pp-low:light-dark(#b32935,#ffb0b9);--pp-low-bg:light-dark(#fce9ec,#502c34);--pp-mid:light-dark(#955009,#ffd095);--pp-mid-bg:light-dark(#fff0da,#4b3926);--pp-high:light-dark(#266d43,#a2dfb9);--pp-high-bg:light-dark(#e5f3e9,#293e31);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--pp-ink)}
#pm-pet-desktop *{box-sizing:border-box}
#pm-pet-desktop .pp-caption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px;font-size:12px;color:var(--pp-muted)}
#pm-pet-desktop .pp-caption-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#pm-pet-desktop .pp-demo-lifecycle{font:inherit;border:0;border-bottom:1px solid var(--pp-line);padding:0 0 1px;background:transparent;color:var(--pp-green)}
#pm-pet-desktop .pp-preview-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px}
#pm-pet-desktop .pp-preview-controls button{font-size:12px;border:1px solid var(--pp-line);border-radius:8px;background:var(--pp-paper);padding:5px 10px;color:var(--pp-muted)}
#pm-pet-desktop .pp-preview-controls button[aria-pressed=true]{color:var(--pp-ink);background:var(--pp-bg2);border-color:var(--pp-muted)}
#pm-pet-desktop .pp-preview-controls button:disabled{opacity:.5;cursor:default}
#pm-pet-desktop .pp-scene{position:relative;height:490px;background:linear-gradient(140deg,var(--pp-bg1),var(--pp-bg2));border-radius:16px;isolation:isolate}
#pm-pet-desktop .pp-corner{position:absolute;top:16px;left:18px;font-size:12px;color:var(--pp-muted);pointer-events:none}
#pm-pet-desktop button{font:inherit;color:inherit;cursor:pointer}
#pm-pet-desktop .pp-panel{position:absolute;z-index:4;width:312px;max-width:calc(100% - 24px);padding:14px 16px;background:var(--pp-paper);border:1px solid var(--pp-line);border-radius:18px;box-shadow:0 12px 32px var(--pp-shadow)}
#pm-pet-desktop .pp-panel::after{content:"";position:absolute;left:var(--pp-tail-x,50%);bottom:-6px;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);background:var(--pp-paper);border-right:1px solid var(--pp-line);border-bottom:1px solid var(--pp-line);pointer-events:none}
#pm-pet-desktop .pp-panel:not([hidden]){animation:pp-panel-in .14s cubic-bezier(.22,1,.36,1)}
#pm-pet-desktop .pp-header{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--pp-muted)}
#pm-pet-desktop .pp-header>span:first-child{min-width:0;overflow-wrap:anywhere}
#pm-pet-desktop .pp-header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
#pm-pet-desktop .pp-close{border:0;padding:2px 6px;background:transparent;border-radius:6px;font-size:19px;line-height:22px}
#pm-pet-desktop .pp-title{font-size:16px;font-weight:500;margin:7px 0 11px}
#pm-pet-desktop .pp-progress-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--pp-muted);font-variant-numeric:tabular-nums}
#pm-pet-desktop .pp-progress-track{height:5px;background:var(--pp-line);border-radius:4px;margin-top:7px;overflow:hidden}
#pm-pet-desktop .pp-progress-fill{display:block;height:100%;width:0;background:var(--pp-green);border-radius:inherit;transition:width .2s ease-out}
#pm-pet-desktop .pp-sync-note{margin-top:6px;font-size:11px;color:var(--pp-muted)}
#pm-pet-desktop .pp-panel[data-waiting=true] .pp-progress-fill{background:var(--pp-mid)}
#pm-pet-desktop .pp-road{margin-top:9px;font-size:12px;color:var(--pp-muted)}
#pm-pet-desktop .pp-road summary{cursor:pointer;width:fit-content}
#pm-pet-desktop .pp-road ol{list-style:none;margin:9px 0 0;padding:0;display:grid;gap:7px}
#pm-pet-desktop .pp-step{display:flex;gap:8px;align-items:baseline;line-height:1.5}
#pm-pet-desktop .pp-step-mark{width:12px;flex:none}
#pm-pet-desktop .pp-step[data-status=current]{color:var(--pp-green);font-weight:500}
#pm-pet-desktop .pp-step[data-status=blocked]{color:var(--pp-mid);font-weight:500}
#pm-pet-desktop .pp-step[data-status=done] .pp-step-mark{color:var(--pp-green)}
#pm-pet-desktop .pp-question{background:var(--pp-warm);border-radius:10px;padding:10px;margin-top:12px}
#pm-pet-desktop .pp-question p{font-size:13px;margin:0 0 8px;line-height:1.5}
#pm-pet-desktop .pp-question-label{display:block;font-size:11px;font-weight:500;margin-bottom:5px;color:var(--pp-ink)}
#pm-pet-desktop .pp-return{width:100%;padding:7px 10px;border:1px solid var(--pp-line);border-radius:7px;background:var(--pp-paper);font-size:12px}
#pm-pet-desktop .pp-settings{margin-top:12px;padding-top:9px;border-top:1px solid var(--pp-line)}
#pm-pet-desktop .pp-settings summary{font-size:12px;color:var(--pp-muted);cursor:pointer;width:fit-content}
#pm-pet-desktop .pp-usage-setting{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--pp-muted);margin-top:10px}
#pm-pet-desktop .pp-usage-setting input{accent-color:var(--pp-green)}
#pm-pet-desktop .pp-size-control{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--pp-muted)}
#pm-pet-desktop .pp-size-label{white-space:nowrap}
#pm-pet-desktop .pp-size-input{width:100%;min-width:0;margin:0;accent-color:var(--pp-green)}
#pm-pet-desktop .pp-size-value{min-width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--pp-ink)}
#pm-pet-desktop .pp-usage-dock{position:absolute;z-index:3;width:max-content;max-width:calc(100% - 24px);display:flex;flex-direction:column;align-items:center;gap:6px}
#pm-pet-desktop .pp-usage-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
#pm-pet-desktop .pp-usage-pill{display:flex;align-items:center;gap:5px;padding:5px 6px 5px 9px;border-radius:9px;background:var(--pp-paper);box-shadow:0 2px 8px var(--pp-shadow);font-size:11px;white-space:nowrap;color:var(--pp-muted)}
#pm-pet-desktop .pp-usage-pill strong{padding:1px 5px;border-radius:5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--pp-ink);background:var(--pp-bg1)}
#pm-pet-desktop .pp-usage-pill[data-tone=low] strong{color:var(--pp-low);background:var(--pp-low-bg)}
#pm-pet-desktop .pp-usage-pill[data-tone=mid] strong{color:var(--pp-mid);background:var(--pp-mid-bg)}
#pm-pet-desktop .pp-usage-pill[data-tone=high] strong{color:var(--pp-high);background:var(--pp-high-bg)}
#pm-pet-desktop .pp-window-hide,#pm-pet-desktop .pp-unavailable-hide{border:0;padding:0 4px;border-radius:5px;background:transparent;color:var(--pp-muted);font-size:16px;line-height:22px}
#pm-pet-desktop .pp-usage-restore{background:var(--pp-paper);border:1px solid var(--pp-line);border-radius:20px;font-size:11px;padding:4px 11px;box-shadow:0 2px 8px var(--pp-shadow);white-space:nowrap}
#pm-pet-desktop .pp-unavailable{display:flex;align-items:center;gap:6px;background:var(--pp-paper);border-radius:9px;padding:5px 8px;font-size:11px;color:var(--pp-muted)}
#pm-pet-desktop .pp-pet{position:absolute;z-index:2;width:92px;height:104px;border:0;padding:0;background:transparent;touch-action:none;user-select:none;cursor:grab;border-radius:30px;transform-origin:top left}
#pm-pet-desktop .pp-pet.pp-dragging{cursor:grabbing}
#pm-pet-desktop .pp-update-dot{position:absolute;z-index:3;width:8px;height:8px;border-radius:50%;background:var(--pp-green);box-shadow:0 0 0 2px var(--pp-paper);pointer-events:none}
#pm-pet-desktop .pp-shadow{position:absolute;width:63px;height:8px;left:14px;bottom:4px;background:var(--pp-shadow);border-radius:50%}
#pm-pet-desktop .pp-owl{position:absolute;width:76px;height:78px;left:8px;bottom:10px;background:var(--pp-fur);border-radius:45% 45% 43% 43%;transform-origin:50% 100%;animation:pp-breathe 4s ease-in-out infinite;box-shadow:inset -4px -3px 0 var(--pp-wing)}
#pm-pet-desktop .pp-tuft{position:absolute;top:-7px;width:18px;height:20px;background:var(--pp-fur);border-radius:80% 10% 0 0}
#pm-pet-desktop .pp-tuft.pp-left{left:4px;transform:rotate(-18deg)}#pm-pet-desktop .pp-tuft.pp-right{right:4px;transform:scaleX(-1) rotate(-18deg)}
#pm-pet-desktop .pp-belly{position:absolute;bottom:5px;left:16px;width:44px;height:30px;background:var(--pp-cream);border-radius:50% 50% 43% 43%}
#pm-pet-desktop .pp-feathers{position:absolute;bottom:8px;left:26px;display:flex;gap:4px}
#pm-pet-desktop .pp-feathers span{height:5px;width:5px;border-bottom:2px solid var(--pp-fur);border-radius:0 0 50% 50%}
#pm-pet-desktop .pp-disc{position:absolute;top:10px;width:37px;height:42px;background:var(--pp-cream);border-radius:50%}
#pm-pet-desktop .pp-disc.pp-left{left:3px;transform:rotate(-8deg)}#pm-pet-desktop .pp-disc.pp-right{right:3px;transform:rotate(8deg)}
#pm-pet-desktop .pp-eye{position:absolute;top:10px;left:9px;width:20px;height:23px;background:var(--pp-face);border-radius:50%;animation:pp-blink 6s infinite;transform-origin:50% 55%}
#pm-pet-desktop .pp-eye:before{content:"";position:absolute;top:4px;right:3px;width:7px;height:8px;background:var(--pp-eye-white);border-radius:50%}
#pm-pet-desktop .pp-eye:after{content:"";position:absolute;bottom:4px;left:4px;width:3px;height:3px;background:var(--pp-eye-white);border-radius:50%;opacity:.8}
#pm-pet-desktop .pp-cheek{position:absolute;top:35px;width:9px;height:5px;background:var(--pp-pink);border-radius:50%;opacity:.9}
#pm-pet-desktop .pp-cheek.pp-left{left:8px}#pm-pet-desktop .pp-cheek.pp-right{right:8px}
#pm-pet-desktop .pp-beak{position:absolute;left:33px;top:36px;width:10px;height:11px;background:var(--pp-gold);border-radius:3px 3px 6px 3px;transform:rotate(45deg)}
#pm-pet-desktop .pp-wing{position:absolute;top:40px;width:15px;height:29px;background:var(--pp-wing);border-radius:65% 35% 65% 35%;transform-origin:50% 10%}
#pm-pet-desktop .pp-wing.pp-left{left:-4px;transform:rotate(-12deg)}#pm-pet-desktop .pp-wing.pp-right{right:-4px;transform:rotate(12deg)}
#pm-pet-desktop .pp-foot{position:absolute;bottom:-2px;width:16px;height:7px;background:var(--pp-gold);border-radius:50%}
#pm-pet-desktop .pp-foot.pp-left{left:13px}#pm-pet-desktop .pp-foot.pp-right{right:13px}
#pm-pet-desktop .pp-needed{position:absolute;z-index:3;white-space:nowrap;font-size:11px;padding:3px 8px;background:var(--pp-warm);border:1px solid var(--pp-line);border-radius:20px;color:var(--pp-ink);pointer-events:none}
#pm-pet-desktop .pp-baby{position:absolute;width:30px;height:31px;bottom:8px;left:-31px;transform-origin:50% 100%;pointer-events:none}
#pm-pet-desktop .pp-baby[data-agent=two]{left:-67px;bottom:13px}
#pm-pet-desktop .pp-chick{position:absolute;width:30px;height:31px;bottom:0;left:0;background:var(--pp-chick);border-radius:47% 47% 43% 43%;box-shadow:inset -2px -2px 0 var(--pp-chick-wing);transform-origin:50% 100%}
#pm-pet-desktop .pp-baby[data-phase=working] .pp-chick{animation:pp-breathe 3.5s ease-in-out infinite}
#pm-pet-desktop .pp-baby[data-agent=two] .pp-chick{animation-delay:-1s}
#pm-pet-desktop .pp-chick:before{content:"";position:absolute;left:12px;top:-5px;width:7px;height:8px;border-top:3px solid var(--pp-chick-wing);border-radius:50%;transform:rotate(-25deg)}
#pm-pet-desktop .pp-chick-eyes{position:absolute;left:7px;top:10px;width:4px;height:5px;border-radius:50%;background:var(--pp-face);box-shadow:12px 0 0 var(--pp-face)}
#pm-pet-desktop .pp-chick-beak{position:absolute;left:13px;top:16px;width:5px;height:5px;background:var(--pp-gold);border-radius:1px;transform:rotate(45deg)}
#pm-pet-desktop .pp-chick-wing{position:absolute;top:18px;left:-2px;width:6px;height:9px;background:var(--pp-chick-wing);border-radius:50%;transform:rotate(-20deg)}
#pm-pet-desktop .pp-chick-wing.pp-right{left:auto;right:-2px;transform:rotate(20deg)}
#pm-pet-desktop .pp-chick-feet{position:absolute;bottom:-2px;left:6px;width:7px;height:4px;background:var(--pp-gold);border-radius:50%;box-shadow:11px 0 0 var(--pp-gold)}
#pm-pet-desktop .pp-shell{position:absolute;left:-1px;width:32px;background:var(--pp-cream);box-shadow:inset -3px -2px 0 var(--pp-chick-wing);opacity:0}
#pm-pet-desktop .pp-shell-top{top:-7px;height:26px;border-radius:55% 55% 0 0;clip-path:polygon(0 0,100% 0,100% 88%,82% 78%,63% 100%,43% 80%,23% 100%,0 84%)}
#pm-pet-desktop .pp-shell-bottom{bottom:-3px;height:24px;border-radius:0 0 50% 50%;clip-path:polygon(0 14%,22% 29%,43% 6%,63% 27%,83% 6%,100% 18%,100% 100%,0 100%)}
#pm-pet-desktop .pp-baby-done{position:absolute;top:-20px;left:9px;font-size:12px;font-weight:500;color:var(--pp-green);opacity:0}
#pm-pet-desktop .pp-baby[data-phase=hatching]{animation:pp-hatch .9s cubic-bezier(.22,1,.36,1) both}
#pm-pet-desktop .pp-baby[data-phase=hatching] .pp-chick{animation:pp-emerge .9s cubic-bezier(.22,1,.36,1) both}
#pm-pet-desktop .pp-baby[data-phase=hatching] .pp-shell-top{animation:pp-shell-open .9s cubic-bezier(.22,1,.36,1) both}
#pm-pet-desktop .pp-baby[data-phase=hatching] .pp-shell-bottom{animation:pp-shell-drop .9s cubic-bezier(.22,1,.36,1) both}
#pm-pet-desktop .pp-baby[data-phase=leaving]{animation:pp-fledge 1.1s cubic-bezier(.25,1,.5,1) both}
#pm-pet-desktop .pp-baby[data-phase=leaving] .pp-chick-wing{animation:pp-flutter .18s ease-in-out infinite;transform-origin:50% 0}
#pm-pet-desktop .pp-baby[data-phase=leaving] .pp-baby-done{animation:pp-done 1.1s ease-out both}
#pm-pet-desktop .pp-planning .pp-owl{animation:pp-think 4.2s ease-in-out infinite}
#pm-pet-desktop .pp-checking .pp-disc{animation:pp-inspect 2.5s ease-in-out infinite}
#pm-pet-desktop .pp-pet[data-activity=complete] .pp-owl{animation:pp-celebrate .65s ease-in-out 2}
#pm-pet-desktop .pp-pet[data-activity=complete] .pp-wing{top:26px;transform:rotate(-40deg)}
#pm-pet-desktop .pp-pet[data-activity=complete] .pp-wing.pp-right{transform:rotate(40deg)}
#pm-pet-desktop .pp-brow{position:absolute;left:11px;top:6px;width:16px;height:3px;background:var(--pp-face);border-radius:50%;opacity:0}
#pm-pet-desktop .pp-book,#pm-pet-desktop .pp-magic,#pm-pet-desktop .pp-lantern{display:none;position:absolute;pointer-events:none}
#pm-pet-desktop .pp-book{left:7px;top:53px;width:62px;height:28px;z-index:5;transform-origin:50% 75%}
#pm-pet-desktop .pp-book-leaf{position:absolute;left:0;top:0;width:31px;height:25px;background:var(--pp-cream);border:3px solid var(--pp-green);border-top-width:2px;border-radius:3px 8px 2px 3px;box-shadow:0 2px 0 var(--pp-wing);transform:skewY(8deg)}
#pm-pet-desktop .pp-book-leaf.pp-right{left:31px;border-radius:8px 3px 3px 2px;transform:skewY(-8deg)}
#pm-pet-desktop .pp-book-leaf::after,#pm-pet-desktop .pp-book-page::after{content:"";position:absolute;left:5px;right:5px;top:6px;height:1px;background:var(--pp-fur);box-shadow:0 4px 0 var(--pp-fur),0 8px 0 var(--pp-fur);opacity:.55}
#pm-pet-desktop .pp-book-page{position:absolute;left:31px;top:0;width:27px;height:21px;background:var(--pp-eye-white);border-radius:5px 2px 2px 1px;transform-origin:0 50%;transform:skewY(-8deg)}
#pm-pet-desktop .pp-book-ribbon{position:absolute;left:39px;top:19px;width:4px;height:10px;background:var(--pp-gold);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
#pm-pet-desktop .pp-pet[data-activity=reading] .pp-book{display:block;animation:pp-book-rock 4s ease-in-out infinite}
#pm-pet-desktop .pp-pet[data-activity=reading] .pp-book-page{animation:pp-page-turn 3.8s cubic-bezier(.25,1,.5,1) infinite}
#pm-pet-desktop .pp-pet[data-activity=reading] .pp-eye{animation:pp-read-eyes 3.8s ease-in-out infinite}
#pm-pet-desktop .pp-pet[data-activity=reading] .pp-brow{opacity:.55;transform:translateY(2px) rotate(7deg)}
#pm-pet-desktop .pp-pet[data-activity=reading] .pp-disc.pp-right .pp-brow{transform:translateY(2px) rotate(-7deg)}
#pm-pet-desktop .pp-pet[data-activity=reading] .pp-wing{top:50px;z-index:6;height:23px}
#pm-pet-desktop .pp-pet[data-activity=reading] .pp-wing.pp-left{left:0;transform:rotate(-42deg)}
#pm-pet-desktop .pp-pet[data-activity=reading] .pp-wing.pp-right{right:0;animation:pp-turn-wing 3.8s ease-in-out infinite}
#pm-pet-desktop .pp-magic{inset:0;z-index:7}
#pm-pet-desktop .pp-wand{position:absolute;left:60px;top:16px;width:4px;height:37px;border-radius:3px;background:var(--pp-wing);box-shadow:inset 0 -9px 0 var(--pp-gold);transform-origin:50% 90%;transform:rotate(24deg)}
#pm-pet-desktop .pp-wand::before{content:"";position:absolute;left:-5px;top:-6px;width:14px;height:14px;background:var(--pp-gold);clip-path:polygon(50% 0,62% 34%,100% 38%,72% 61%,80% 100%,50% 78%,20% 100%,28% 61%,0 38%,38% 34%)}
#pm-pet-desktop .pp-spark{position:absolute;left:46px;top:1px;width:9px;height:9px;background:var(--pp-gold);clip-path:polygon(50% 0,64% 36%,100% 50%,64% 64%,50% 100%,36% 64%,0 50%,36% 36%);opacity:0}
#pm-pet-desktop .pp-spark:nth-child(3){left:25px;top:12px;width:7px;height:7px;--pp-spark-delay:.12s}
#pm-pet-desktop .pp-spark:nth-child(4){left:66px;top:2px;width:6px;height:6px;--pp-spark-delay:.24s}
#pm-pet-desktop .pp-pet[data-activity=magic] .pp-magic{display:block}
#pm-pet-desktop .pp-pet[data-activity=magic] .pp-owl{animation:pp-cast 1.2s cubic-bezier(.25,1,.5,1) both}
#pm-pet-desktop .pp-pet[data-activity=magic] .pp-wand{animation:pp-wand-swish 1.2s cubic-bezier(.25,1,.5,1) both}
#pm-pet-desktop .pp-pet[data-activity=magic] .pp-spark{animation:pp-sparkle .85s cubic-bezier(.25,1,.5,1) var(--pp-spark-delay,.06s) both}
#pm-pet-desktop .pp-pet[data-activity=magic] .pp-wing.pp-right{top:40px;right:2px;width:13px;height:24px;transform:rotate(-28deg);animation:pp-cast-wing 1.2s cubic-bezier(.25,1,.5,1) both}
#pm-pet-desktop .pp-pet[data-activity=magic] .pp-disc{animation:none}
#pm-pet-desktop .pp-pet[data-activity=magic] .pp-disc.pp-left .pp-eye{animation:pp-wink 1.2s ease-in-out both}
#pm-pet-desktop .pp-pet[data-activity=magic] .pp-cheek{transform:scale(1.15);opacity:1}
#pm-pet-desktop .pp-lantern{left:60px;top:15px;width:22px;height:39px;z-index:7;transform-origin:50% 5px}
#pm-pet-desktop .pp-lantern-handle{position:absolute;left:7px;top:0;width:8px;height:10px;border:2px solid var(--pp-wing);border-radius:50%}
#pm-pet-desktop .pp-lantern-cap{position:absolute;left:2px;top:8px;width:18px;height:5px;background:var(--pp-wing);border-radius:4px 4px 1px 1px}
#pm-pet-desktop .pp-lantern-light{position:absolute;left:3px;top:12px;width:16px;height:22px;background:var(--pp-chick);border:2px solid var(--pp-gold);border-radius:3px 3px 6px 6px;box-shadow:inset 3px 0 0 var(--pp-eye-white)}
#pm-pet-desktop .pp-lantern-light::after{content:"";position:absolute;left:5px;top:4px;width:3px;height:10px;border-radius:50%;background:var(--pp-eye-white)}
#pm-pet-desktop .pp-lantern-base{position:absolute;left:2px;top:33px;width:18px;height:4px;background:var(--pp-wing);border-radius:1px 1px 3px 3px}

function attentionKind(p){return p.question?(p.question.kind==='input'?'input':'decision'):null;}
function questionState(p){
 const question=p.question;if(!question)return null;
 const reviewing=question.status==='awaiting_review';
 const status=reviewing?'awaiting_review':'awaiting_reply';
 const items=Array.isArray(question.items)?question.items:[];
 const item=reviewing?null:items.find(item=>item&&item.answered!==true);
 const itemIndex=item?(Number.isInteger(item.index)?item.index:items.indexOf(item)):null;
 const itemID=item?.questionItemId??null;
 const kind=attentionKind(p);
 const destination=['codex','system','terminal'].includes(question.destination)?question.destination:'codex';
 return {
  key:JSON.stringify([p.id,p.generation,question.id,itemIndex,itemID,status]),
  status,reviewing,kind,destination,itemIndex,
  attention:reviewing?'review':kind,
  text:item?.text||question.text||'',
  canAnswer:!reviewing,
  showDestinationHint:!reviewing&&kind==='input'&&destination!=='codex',

}
function completedTransitions(previous,next){
 if(!previous||previous.id!==next.id||previous.generation!==next.generation||next.question||next.roadmapNeedsUpdate)return [];

}
function roadmapState(p,limit=7){
 const question=questionState(p);
 const steps=Array.isArray(p.steps)?p.steps:[];
 const pending=steps.filter(step=>!step.done);
 const candidate=pending.find(step=>step.id===p.currentStepId)||pending.find(step=>step.label===p.currentStep)||pending[0];
 const blocked=p.question?(pending.find(step=>step.id===p.question.stepId)||candidate):null;
 const working=['planning','building','running','checking'].includes(p.phase)&&!['disconnected','unavailable','error'].includes(p.sourceStatus);
 const current=!p.roadmapNeedsUpdate&&!p.question&&working?candidate:null;
 const all=steps.map((step,index)=>({...step,index,status:step.done?'done':step.id===blocked?.id?question.attention:step.id===current?.id?'current':'pending'}));
 const focus=blocked||candidate;
 const focusIndex=focus?steps.findIndex(step=>step.id===focus.id):Math.max(0,steps.length-1);
 const start=Math.max(0,Math.min(focusIndex-Math.floor(limit/2),steps.length-limit));
 return {all,visible:all.slice(start,start+limit),before:start,after:Math.max(0,all.length-start-limit),reviewing:!!p.roadmapNeedsUpdate};
}
function compactRoadmap(p){
 const model=roadmapState(p),question=questionState(p),kind=question?.attention;

 if(model.reviewing&&!kind)return {...model,visible:[{id:'review',label:'Reviewing your new request',status:'review'}],before:0,after:0};

}
/* PET_STATE_END */
function activity(p){return p.question?'attention':['unavailable','disconnected','error'].includes(p.sourceStatus)?'idle':({waiting:'attention',paused:'idle',building:'reading',running:'reading',planning:'reading',checking:'reading',complete:'complete',completed:'complete'}[p.phase]||'idle');}

 else if(completed.length){clearTimeout(magicTimer);owl.dataset.activity='magic';mini.classList.remove('is-celebrating');requestAnimationFrame(()=>{if(currentPet&&!currentPet.question&&!currentPet.roadmapNeedsUpdate&&magicTimer)mini.classList.add('is-celebrating')});magicTimer=setTimeout(()=>{owl.dataset.activity=activity(currentPet);mini.classList.remove('is-celebrating');magicTimer=null},1250);}

}
function renderMini(p,panelVisible){

 if(signature===miniSignature)return;miniSignature=signature;row.replaceChildren();
 const names={done:'Completed',current:'In progress',pending:'Not started',decision:'Feedback needed',input:'Information needed',review:questionState(p)?.reviewing?'Reviewing reply':'Reviewing request'};
 function button(label,status,index,overflow){
  const b=document.createElement('button');b.type='button';b.className='mini-step'+(overflow?' mini-overflow':'');b.dataset.status=status;b.title=label+' · Open roadmap';b.setAttribute('aria-label',b.title);b.style.setProperty('--dot-index',index);

 if(model.before&&!model.reviewing)button(model.before+' earlier steps','pending',0,'+'+model.before);
 items.forEach((step,index)=>button((step.index===undefined?'':'Step '+(step.index+1)+': ')+step.label+' — '+names[step.status],step.status,index));
 if(!items.length)button('No roadmap reported','pending',0);

function startChildTimer(slot){
 if(childrenPaused||!slot.complete||slot.timer!==null)return;
 slot.startedAt=performance.now();
 slot.timer=setTimeout(()=>{slot.timer=null;slot.remaining=0;const complete=slot.complete;slot.complete=null;complete?.();},slot.remaining);
}
function scheduleChild(slot,phase,duration,complete){
 clearTimeout(slot.timer);slot.timer=null;slot.remaining=duration;slot.complete=complete;slot.el.dataset.phase=phase;startChildTimer(slot);
}
function pauseChildren(paused){
 owl.classList.toggle('pp-children-paused',paused);
 if(paused===childrenPaused)return;
 childrenPaused=paused;
 childSlots.forEach(slot=>{
  if(paused&&slot.timer!==null){clearTimeout(slot.timer);slot.timer=null;slot.remaining=Math.max(0,slot.remaining-(performance.now()-slot.startedAt));}
  else if(!paused)startChildTimer(slot);

}
function renderChildren(p){
 pauseChildren(!!p.question||p.phase==='waiting'||p.phase==='paused');
 const active=(Array.isArray(p.children)?p.children:[]).filter(c=>c&&c.id&&!['completed','complete','done','closed','failed'].includes(c.status));
 const activeIDs=new Set(active.map(c=>String(c.id)));
 // Keep each chick's identity stable; another child's completion must not
 // move this chick into a different slot or replay its hatching animation.
 // While waiting, retain the visible moment. Reconcile the latest snapshot
 // after the decision rather than playing a backlog of lifecycle changes.
 if(!childrenPaused){
  childSlots.forEach(slot=>{
   if(slot.id===null)return;
   if(activeIDs.has(slot.id)){
    if(slot.el.dataset.phase==='leaving'){clearTimeout(slot.timer);slot.timer=null;slot.complete=null;slot.el.dataset.phase='working';}
   }else if(slot.el.dataset.phase!=='leaving'){
    scheduleChild(slot,'leaving',1150,()=>{slot.el.hidden=true;slot.el.dataset.phase='none';delete slot.el.dataset.child;slot.id=null;if(currentPet)renderChildren(currentPet);});
   }
  });
  for(const child of active){
   const id=String(child.id);if(childSlots.some(slot=>slot.id===id))continue;
   const slot=childSlots.find(slot=>slot.id===null);if(!slot)break;
   slot.id=id;slot.el.dataset.child=id;slot.el.hidden=false;
   scheduleChild(slot,'hatching',950,()=>{slot.el.dataset.phase='working';});
  }
 }

 if(extra>0){if(!more){more=document.createElement('span');more.className='native-more';owl.append(more)}more.textContent='+'+extra;more.title=active.length+' subagents';}else more?.remove();
}
function quota(q,p){

 let count=0;
 for(const [key,label] of [['five','5h'],['week','Weekly']]){
  const window=q?.windows?.[key];if(!window||!Number.isFinite(window.remainingPercent))continue;
  const value=Math.round(Math.max(0,Math.min(100,window.remainingPercent)));
  const pill=document.createElement('span');pill.className='pp-usage-pill';pill.dataset.tone=value<=20?'low':value<70?'mid':'high';pill.title=label+' account quota remaining';
  const name=document.createElement('span');name.textContent=label;
  const strong=document.createElement('strong');strong.textContent=value+'%';pill.append(name,strong);row.append(pill);count++;
 }
 row.hidden=!count;
 if(count){const close=document.createElement('button');close.className='native-quota-close';close.textContent='×';close.setAttribute('aria-label','Hide usage');close.onclick=()=>send({action:'hideQuota'});row.append(close)}
 wrap.querySelector('.pp-unavailable').hidden=count>0;
 const time=dateText(q?.observedAt);const source=String(q?.source||'');
 const from=source.includes('transcript')||source.includes('session')?'From chat':source.includes('app-server')||source.includes('account')?'Account update':source?'Cached usage':'Waiting for usage';
 wrap.querySelector('.native-freshness').textContent=from+(time?' · '+time:'');
 wrap.querySelector('.native-freshness').title=dateTooltip(q?.observedAt);
}
let measureFrame=null,lastGlass='';
function measure(){
 if(measureFrame!==null)return;
 measureFrame=requestAnimationFrame(()=>{
  measureFrame=null;
  if(surface==='panel')send({action:'panelHeight',height:$('.pp-panel').offsetHeight+14});
  const selectors=surface==='panel'?[['panel','.pp-panel']]:[['name','.native-name'],['quota','.native-quota .pp-usage-row:not([hidden]),.native-quota .pp-unavailable:not([hidden])'],['attention','.native-needs']];
  const regions=selectors.flatMap(([id,selector])=>{
   const el=$(selector);if(!el.getClientRects().length)return [];
   const rect=el.getBoundingClientRect();
   return [{id,x:rect.x,y:rect.y,width:rect.width,height:rect.height,radius:parseFloat(getComputedStyle(el).borderTopLeftRadius)||0}];
  });
  const encoded=JSON.stringify(regions);if(encoded!==lastGlass){lastGlass=encoded;send({action:'glassRegions',regions});}

}
const glassObserver=new ResizeObserver(measure);
['.pp-panel','.native-name','.native-quota'].forEach(selector=>glassObserver.observe($(selector)));
window.addEventListener('resize',measure);
window.renderPet=function(data){

 $('.native-name').textContent=p.title||'Codex conversation';$('.native-name').title=p.title||'Codex conversation';
 const question=questionState(p),kind=question?.kind,attention=question?.attention;owl.dataset.attention=attention||'';$('.native-needs').dataset.kind=attention||'';
 owl.setAttribute('aria-expanded',String(!!data.panelVisible));$('.native-needs').hidden=!kind||!data.panelVisible;text('.native-needs',question?.reviewing?'Reviewing reply':kind==='input'?'Input needed':'Feedback needed');
 renderMini(p,data.panelVisible);updateAnimation(p);renderChildren(p);quota(data.quota,p);
 text('.native-title',p.title||'Codex conversation');
 const reviewing=!!p.roadmapNeedsUpdate;
 text('.native-phase',question?.reviewing?'Reviewing reply':kind==='input'?'Input needed':kind?'Feedback needed':reviewing?'Planning':({building:'Building',running:'Building',planning:'Planning',checking:'Checking',waiting:'Needs you',complete:'Complete',completed:'Complete',idle:'Idle',paused:'Paused',error:'Source error'}[p.phase]||'Connected'));
 text('.pp-title',reviewing?'Reviewing your new request':p.currentStep||'');$('.pp-title').hidden=!!kind||(!reviewing&&!p.currentStep);

 roadmapState(p).all.forEach(step=>{const li=document.createElement('li');li.className='pp-step';li.dataset.status=step.status;const mark=document.createElement('span');mark.className='pp-step-mark';mark.textContent=({done:'✓',current:'›',decision:'?',input:'!'})[step.status]||'○';const label=document.createElement('span');label.textContent=step.label||'';li.append(mark,label);ol.append(li)});

 const questionKey=question?.key??null;
 if(questionKey&&questionKey!==displayedQuestionKey){$('.pp-panel').scrollTop=0;$('.pp-question p').scrollTop=0;$('.pp-road').scrollTop=0;}

 const stamp=dateText(p.sourceUpdatedAt);const status=['disconnected','connecting'].includes(p.sourceStatus)?'Waiting for Codex':p.sourceStatus==='stale'?'Last reported state':['error','unavailable'].includes(p.sourceStatus)?'Source unavailable':['connected','reported'].includes(p.sourceStatus)?'From Codex':'Awaiting update';
 text('.native-source',status+(stamp?' · '+stamp:''));$('.native-source').title=dateTooltip(p.sourceUpdatedAt);measure();

$('.pp-close').onclick=()=>send({action:'hidePanel'});$('.pp-return').onclick=()=>send({action:'openConversation'});$('.native-menu').onclick=()=>send({action:'menu'});$('.native-needs').onclick=()=>send({action:'togglePanel'});
$('.pp-unavailable .native-quota-close').onclick=()=>send({action:'hideQuota'});$('.pp-road').ontoggle=measure;
let start=null,dragged=false;
owl.addEventListener('pointerdown',e=>{if(e.button!==0)return;start={x:e.screenX,y:e.screenY};dragged=false;owl.setPointerCapture(e.pointerId);send({action:'dragStart'});});
