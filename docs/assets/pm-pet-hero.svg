  <text x="62" y="211" class="display" style="font-size:67px">Stay close to</text>
  <text x="62" y="280" class="display" style="font-size:67px">what matters.</text>
  <text x="65" y="340" class="body muted">A small companion for</text>
  <text x="65" y="372" class="body muted">co-building with Codex.</text>
