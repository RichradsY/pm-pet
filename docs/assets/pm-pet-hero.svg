<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">PM Pet — stay close to what matters</title>
  <desc id="description">Illustrative sample UI, not real user data. A sage owl reads beside a roadmap showing two of five steps, with a small helper chick and sample weekly quota of 72 percent. A blue owl holds a yellow lantern for a product decision that opens in Codex. PM Pet is a macOS companion for co-building with Codex.</desc>
  <style>
  :root { color-scheme: light dark; --paper:#f5f7f1; --ink:#293e34; --muted:#68776c;
    --line:#dbe3d9; --panel:#ffffff; --panel-line:#d5dfd4; --field:#e9eee3;
    --green:#527d64; --green-soft:#dfe9de; --gold:#bf8533; --gold-soft:#fff0cd;
    --button:#eaf0e5; --shadow:#60765e; --cream:#fff0d5; --eye:#3d302b;
    --eye-white:#fffdf8; --cheek:#e9ad9b; --beak:#eea949; --book:#fff7e7;
    --book-line:#637b66; --chick:#ffe196; --chick-wing:#dfb663;
    --sage:#80a88f; --sage-wing:#627e6c; --sky:#83a4bd; --sky-wing:#6b8193; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#17251f; --ink:#e3ecdf; --muted:#a8b9ac; --line:#35493c;
      --panel:#23382b; --panel-line:#425746; --field:#203426; --green:#a6cfa7;
      --green-soft:#344c39; --gold:#f1c267; --gold-soft:#463c23; --button:#354d38;
      --shadow:#07170d; --cream:#f0daba; --eye:#33261f; --eye-white:#fff5e4;
      --cheek:#dca395; --beak:#e5a34f; --book:#f0e3ca; --book-line:#617d68;
      --chick:#efd089; --chick-wing:#d6ac60; --sage:#86ad95; --sage-wing:#6b8975;
      --sky:#8faec5; --sky-wing:#708a9c; }
  }
  text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:var(--ink); }
  .display { font-family:Georgia,'Times New Roman',serif; font-weight:400; letter-spacing:-2.4px; }
  .muted { fill:var(--muted); }
  .label { font-size:15px; font-weight:650; letter-spacing:1.8px; }
  .body { font-size:22px; }
  .small { font-size:17px; }
  .panel { fill:var(--panel); stroke:var(--panel-line); stroke-width:1.5; }
  .line { stroke:var(--line); fill:none; }
  .sage { --fur:var(--sage); --wing:var(--sage-wing); }
  .sky { --fur:var(--sky); --wing:var(--sky-wing); }
</style>
